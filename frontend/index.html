<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harness</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <aside id="sidebar">
        <header>
            <h1>harness</h1>
            <p class="subtitle">Phase 1 — chat + one tool</p>
        </header>

        <section>
            <h2>Backend</h2>
            <label>
                Where requests go
                <select id="cfg-backend"></select>
            </label>
            <p id="cfg-backend-desc" class="muted"></p>
        </section>

        <section>
            <h2>Model</h2>
            <label>
                Name
                <input id="cfg-model-name" type="text" />
            </label>
            <label>
                Temperature <span id="cfg-temp-value" class="value"></span>
                <input id="cfg-temp" type="range" min="0" max="2" step="0.05" />
            </label>
            <label>
                top_p <span id="cfg-topp-value" class="value"></span>
                <input id="cfg-topp" type="range" min="0" max="1" step="0.01" />
            </label>
            <label>
                Max tokens
                <input id="cfg-maxtokens" type="number" min="1" max="32768" />
            </label>
        </section>

        <section>
            <h2>System prompt</h2>
            <textarea id="cfg-system" rows="8"></textarea>
        </section>

        <section>
            <h2>Reasoning style</h2>
            <select id="cfg-style"></select>
            <p id="cfg-style-desc" class="muted"></p>
        </section>

        <section>
            <h2>Tools</h2>
            <label class="inline">
                <input id="cfg-tools-enabled" type="checkbox" />
                Tools enabled
            </label>
            <div id="cfg-tools-list"></div>
        </section>

        <section class="actions">
            <button id="cfg-save" class="primary">Save</button>
            <button id="cfg-reset">Reload</button>
            <span id="cfg-status" class="muted"></span>
        </section>
    </aside>

    <main>
        <nav class="tabs">
            <button class="tab active" data-tab="chat">Chat</button>
            <button class="tab" data-tab="trace">Trace</button>
            <button class="tab" data-tab="config">Config (raw)</button>
            <span class="spacer"></span>
            <span id="session-id" class="muted"></span>
            <button id="new-session">New session</button>
        </nav>

        <section id="tab-chat" class="tab-panel active">
            <div id="messages"></div>
            <form id="chat-form">
                <textarea id="chat-input" rows="2" placeholder="Message the model… (try: what's in example.txt?)"></textarea>
                <button type="submit">Send</button>
            </form>
        </section>

        <section id="tab-trace" class="tab-panel">
            <div class="trace-controls">
                <button id="trace-refresh">Refresh</button>
                <button id="trace-clear">Clear</button>
                <span class="muted">Per-turn request/response, tool calls, tool results.</span>
            </div>
            <div id="trace-events"></div>
        </section>

        <section id="tab-config" class="tab-panel">
            <p class="muted">Raw YAML on disk at <code>config/default.yaml</code>. Edit in the sidebar; this view is read-only.</p>
            <pre id="config-raw"></pre>
        </section>
    </main>

    <script src="/static/config.js"></script>
    <script src="/static/chat.js"></script>
</body>
</html>
