backend: litellm
model:
  name: claude-haiku-4-5
  temperature: 0.75
  top_p: 0.95
  max_tokens: 8096
system_prompt: "You are a helpful, concise assistant running inside an open-source\
  \ agent\nharness. Answer the user's question directly. If the user mentions a\n\
  file, use the read_file tool \u2014 paths are relative to the harness sandbox\n\
  directory. If the user names a URL or asks about a web resource, use\nweb_fetch.\
  \ If the user asks a factual question you can't answer from\nprior knowledge, use\
  \ web_search.\n"
reasoning_style: default
tools:
  enabled: true
  allowlist:
  - read_file
  - web_fetch
  - web_search
memory:
  enabled: false
